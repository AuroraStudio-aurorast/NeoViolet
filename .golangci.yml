version: "2"
run:
  timeout: 3m
linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - revive
    - misspell
    - gocritic
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Printf
        - fmt.Println
  exclusions:
    generated: lax
