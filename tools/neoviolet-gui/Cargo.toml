[package]
name = "neoviolet-gui"
version = "0.1.0"
edition = "2024"
description = "Iced desktop terminal for NeoViolet"
license = "MIT"
publish = false

[dependencies]
iced = { version = "=0.14.0", features = ["tokio"] }
iced_term = { path = "../../.build/gui-deps/iced_term" }

[patch.crates-io]
winit = { path = "../../.build/gui-deps/winit" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
