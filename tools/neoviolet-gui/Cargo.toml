[package]
name = "neoviolet-gui"
version = "0.1.0"
edition = "2024"
description = "Iced desktop terminal for NeoViolet"
license = "MIT"
publish = false

[dependencies]
iced = { version = "=0.14.0", features = ["tokio"] }
iced_term = { path = "../../.build/gui-deps/iced_term" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
toml = "1"
unicode-segmentation = "1.13"
open = "5"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
muda = "0.17"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSURL", "NSString", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13.2"

[patch.crates-io]
iced_wgpu = { path = "../../.build/gui-deps/iced_wgpu" }
winit = { path = "../../.build/gui-deps/winit" }

[dev-dependencies]
iced_tiny_skia = "=0.14.0"
iced_runtime = "=0.14.0"
tempfile = "3"

[[test]]
name = "native_chrome"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
