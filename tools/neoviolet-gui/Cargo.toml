[package]
name = "neoviolet-gui"
version = "0.1.0"
edition = "2024"
description = "Iced desktop terminal for NeoViolet"
license = "MIT"
publish = false

[dependencies]
iced = { version = "=0.14.0", features = ["tokio"] }
iced_term = { path = "../../.build/gui-deps/iced_term" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
toml = "1"
open = "5"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSURL", "NSString"] }

[patch.crates-io]
winit = { path = "../../.build/gui-deps/winit" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
