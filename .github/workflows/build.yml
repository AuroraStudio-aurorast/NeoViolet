name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

# Floating versions can turn CI red without a code change: `make tidy/check`
# depends on the Go version, and the linters decide pass/fail themselves. The
# libopenmpt version is deliberately absent; deps/libopenmpt.lock owns it.
env:
  GO_VERSION: "1.27.2"
  RUST_VERSION: "1.98.0"
  GOLANGCI_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0

# Actions are pinned to commit SHAs because a tag is mutable: a retagged or
# compromised release would otherwise run arbitrary code in this workflow.
permissions:
  contents: read

# On main a cancelled run leaves the landed commit with no green result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The race detector needs cgo, even though the shipped binaries are
      # pure Go.
      CGO_ENABLED: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only what the Rust GUI links against; Go is pure and libopenmpt is
          # loaded at run time.
          - os: ubuntu-latest
            apt: >-
              llvm-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
          - os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq ${{ matrix.apt }}
      - name: Setup Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Go tests (race)
        run: make test/race
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ env.GOLANGCI_VERSION }}
      - name: Rust tests
        run: make test/rust
      - name: Rust fmt + clippy
        run: make lint/rust
      # The coverage run recompiles every package with instrumentation, so
      # running these three twice only doubled the job's runtime.
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: make test/coverage
      - name: go mod tidy check
        if: matrix.os == 'ubuntu-latest'
        run: make tidy/check
      - name: Line length gate
        if: matrix.os == 'ubuntu-latest'
        run: make check/linelength

  security:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The shipped package set is pure Go, so no C toolchain is needed.
      CGO_ENABLED: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: >-
          go run
          golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          ./...

  unix:
    name: ${{ matrix.os }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.os == 'macos' && 'darwin' || 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            goarch: amd64
            runner: ubuntu-latest
            apt: >-
              llvm-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
          - os: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            apt: >-
              llvm-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
          - os: macos
            goarch: amd64
            runner: macos-15-intel
          - os: macos
            goarch: arm64
            runner: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install system dependencies
        if: matrix.os == 'linux'
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq ${{ matrix.apt }}
      - name: Setup Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Set version info
        run: |
          # A tag name is repository-controlled text; interpolating it into a
          # shell script would be an injection vector.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            sha=$(git rev-parse --short HEAD)
            echo "VERSION=dev-r${GITHUB_RUN_ID}-$sha" >> $GITHUB_ENV
          fi
      - name: Build binary
        run: |
          set -eux
          export GOARCH=${{ matrix.goarch }}
          make build
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: neoviolet-${{ matrix.os }}-${{ matrix.goarch }}
          path: |
            neoviolet
            apecli
            neoviolet-gui
          if-no-files-found: error

  windows:
    name: windows-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CGO_ENABLED: 0
      GOOS: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSYS2 supplies make and clang; Go, Rust and libopenmpt come from
          # setup-go, rustup and this repository's dependency pipeline.
          - goarch: amd64
            runner: windows-latest
            msystem: CLANG64
            env_prefix: clang64
            pkg_prefix: mingw-w64-clang-x86_64
            rust_host: x86_64-pc-windows-gnullvm
          - goarch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            env_prefix: clangarm64
            pkg_prefix: mingw-w64-clang-aarch64
            rust_host: aarch64-pc-windows-gnullvm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # `path-type: inherit` lets this shell see setup-go's and rustup's
      # installs; without it neither is on PATH.
      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.pkg_prefix }}-clang
            make
          path-type: inherit
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Installed as the *host* toolchain so cargo's output stays in
      # target/release, which is where the Makefile looks for it.
      - name: Setup Rust
        run: |
          rustup toolchain install "$RUST_VERSION-${{ matrix.rust_host }}" \
            --profile minimal
          rustup default "$RUST_VERSION-${{ matrix.rust_host }}"
      - name: Set version info
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            sha=$(git rev-parse --short HEAD)
            echo "VERSION=dev-r${GITHUB_RUN_ID}-$sha" >> $GITHUB_ENV
          fi
      # LoadLibrary searches the executable's own directory first, so the
      # library ships beside neoviolet.exe. Fetched before the build so a
      # missing release fails in seconds rather than minutes.
      - name: Download libopenmpt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          version=$(sed -n 's/^LIBOPENMPT_VERSION=//p' deps/libopenmpt.lock)
          case "${{ matrix.goarch }}" in
            amd64) arch=x86_64 ;;
            arm64) arch=aarch64 ;;
          esac
          tag="deps"
          asset="libopenmpt-${version}-win-${arch}.dll"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::the '$tag' release with the dependency libraries" \
              "does not exist yet. Run the 'Build libopenmpt dependency'" \
              "workflow once with publish enabled."
            exit 1
          fi
          mkdir -p dist
          gh release download "$tag" -p "$asset" -p "${asset}.sha256" -D dist
          expected=$(awk '{print $1}' "dist/${asset}.sha256")
          actual=$(sha256sum "dist/${asset}" | awk '{print $1}')
          if [ "$expected" != "$actual" ]; then
            echo "::error::checksum mismatch for $asset"
            exit 1
          fi
          rm -f "dist/${asset}.sha256"
          mv "dist/${asset}" dist/libopenmpt.dll
      - name: Build binary
        run: |
          set -eux
          go version
          rustc --version
          export GOARCH=${{ matrix.goarch }}
          make build
      - name: Collect DLLs
        run: |
          set -eux
          mkdir -p dist
          cp neoviolet.exe dist/
          cp apecli.exe dist/ 2>/dev/null || true
          cp neoviolet-gui.exe dist/ 2>/dev/null || true
          BIN_DIR="/${{ matrix.env_prefix }}/bin"
          SYSTEM_DLLS="^(KERNEL32|ntdll|USER32|GDI32|ADVAPI32|SHELL32|OLE32|MSVCRT|VCRUNTIME|api-ms-win|ucrtbase|WS2_32|IPHLPAPI|SETUPAPI|CRYPT32|bcrypt|PSAPI|WINMM|VERSION|combase|RPCRT4|SHLWAPI|oleaut32|IMM32|MSCTF|kernel\.appcore|windows\.storage)\.dll$"
          declare -A seen
          # The Rust binaries link the C++ runtime from this toolchain, so copy
          # every non-Windows import. libopenmpt needs only the C runtime, so
          # it does not seed the walk.
          to_process=("neoviolet.exe" "neoviolet-gui.exe")
          while [ ${#to_process[@]} -gt 0 ]; do
            current="${to_process[0]}"
            to_process=("${to_process[@]:1}")
            deps=$(objdump -p "$current" | grep "DLL Name" | awk '{print $3}' \
              | sort -u)
            for dll in $deps; do
              if [[ "$dll" =~ $SYSTEM_DLLS ]] || [[ -v seen[$dll] ]]; then
                continue
              fi
              seen["$dll"]=1
              SRC="${BIN_DIR}/${dll}"
              if [ -f "$SRC" ]; then
                cp "$SRC" dist/
                to_process+=("$SRC")
              else
                echo "Skipping (not found in $BIN_DIR): $dll"
              fi
            done
          done
          ls -lh dist/
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: neoviolet-windows-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
