name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

# Pin every toolchain. One of the gates is `make tidy/check`, whose result
# depends on the Go version, and the linters decide pass/fail themselves, so a
# floating `stable`/`latest` can turn CI red without a code change.
env:
  GO_VERSION: "1.27.1"
  RUST_VERSION: "1.98.0"
  GOLANGCI_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.8.0
  LIBOPENMPT_VERSION: 0.8.7

# Actions are pinned to commit SHAs because a tag is mutable: a retagged or
# compromised release would otherwise run arbitrary code in this workflow.
#   actions/checkout@v7               3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-go@v7               b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
#   actions/upload-artifact@v7       043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   golangci/golangci-lint-action@v9 ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
#   msys2/setup-msys2@v2             66cd2cce69caa17b53920067426061ca1de3a884
# Least privilege: nothing in this workflow writes to the repository.
permissions:
  contents: read

# Cancel superseded runs on pull requests only. On main a cancelled run means no
# green result exists for the commit that landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            apt: >-
              clang pkg-config make libasound2-dev libopenmpt-dev
              libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
            install_cmd: >-
              sudo apt-get update -qq &&
              sudo apt-get install -y -qq
          - os: macos-latest
            brew: "pkg-config make libopenmpt"
            install_cmd: "brew install"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install system dependencies
        run: ${{ matrix.install_cmd }} ${{ matrix.apt || matrix.brew }}
      # Pinned instead of `stable`; clippy and rustfmt ship with the toolchain.
      - name: Setup Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      # Every gate below is a `make` target, so CI and a developer's machine run
      # the same commands. The previous inline `go vet ./...` step is gone: it
      # could not honour //nolint, so the Linux-only MPRIS code failed it on
      # every pull request — including Rust-only ones — and masked the five
      # steps that followed.
      - name: Go tests (race)
        run: make test/race
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: ${{ env.GOLANGCI_VERSION }}
      - name: Rust tests
        run: make test/rust
      - name: Rust fmt + clippy
        run: make lint/rust
      - name: Coverage gate
        run: make test/coverage
      - name: go mod tidy check
        run: make tidy/check
      - name: Line length gate
        run: make check/linelength

  security:
    name: govulncheck
    runs-on: ubuntu-latest
    # Also runs on pull requests, so a new vulnerability surfaces before merge
    # instead of only on the weekly schedule.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # govulncheck type-checks and builds every package, so it needs the same
      # C system libraries as the test job. Without them the cgo audio backend
      # fails with "could not import C (no metadata for C)" and the scan never
      # actually ran — which is why this job has been red since it was added.
      - name: Install system dependencies
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq clang pkg-config make libasound2-dev
          libopenmpt-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: govulncheck
        run: >-
          go run
          golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          ./...

  unix:
    name: ${{ matrix.os }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CGO_ENABLED: 1
      GOOS: ${{ matrix.os == 'macos' && 'darwin' || 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            goarch: amd64
            runner: ubuntu-latest
            cc: clang
            cxx: clang++
            pkgs: >-
              clang llvm-dev pkg-config make libasound2-dev libopenmpt-dev
              libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
            install_cmd: >-
              sudo apt-get update -qq &&
              sudo apt-get install -y -qq
          - os: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            cc: clang
            cxx: clang++
            pkgs: >-
              clang llvm-dev pkg-config make libasound2-dev libopenmpt-dev
              libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
            install_cmd: >-
              sudo apt-get update -qq &&
              sudo apt-get install -y -qq
          - os: macos
            goarch: amd64
            runner: macos-15-intel
            cc: clang
            cxx: clang++
            pkgs: "pkg-config make libopenmpt"
            install_cmd: "brew update && brew install"
          - os: macos
            goarch: arm64
            runner: macos-latest
            cc: clang
            cxx: clang++
            pkgs: "pkg-config make libopenmpt"
            install_cmd: "brew update && brew install"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install system dependencies
        run: ${{ matrix.install_cmd }} ${{ matrix.pkgs }}
      # Pinned instead of `stable`, matching the test job.
      - name: Setup Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Set version info
        run: |
          # Use the runner's environment variables instead of GitHub expression
          # interpolation: a tag name is repository-controlled text, and
          # interpolating it into a shell script is a script-injection vector.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            sha=$(git rev-parse --short HEAD)
            echo "VERSION=dev-r${GITHUB_RUN_ID}-$sha" >> $GITHUB_ENV
          fi
      - name: Build binary
        run: |
          set -eux
          export GOARCH=${{ matrix.goarch }}
          export CC="${{ matrix.cc }}"
          export CXX="${{ matrix.cxx }}"
          make build
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neoviolet-${{ matrix.os }}-${{ matrix.goarch }}
          path: |
            neoviolet
            apecli
            neoviolet-gui
          if-no-files-found: error

  windows:
    name: windows-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CGO_ENABLED: 1
      GOOS: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: windows-latest
            msystem: CLANG64
            env_prefix: clang64
            pkg_prefix: mingw-w64-clang-x86_64
            compiler_pkg: mingw-w64-clang-x86_64-clang
            libopenmpt_pkg: mingw-w64-clang-x86_64-libopenmpt
            go_pkg: mingw-w64-clang-x86_64-go
            rust_pkg: mingw-w64-clang-x86_64-rust
            cc: clang
            cxx: clang++
          - goarch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            env_prefix: clangarm64
            pkg_prefix: mingw-w64-clang-aarch64
            compiler_pkg: mingw-w64-clang-aarch64-clang
            libopenmpt_pkg: mingw-w64-clang-aarch64-libopenmpt
            go_pkg: mingw-w64-clang-aarch64-go
            rust_pkg: mingw-w64-clang-aarch64-rust
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.compiler_pkg }}
            ${{ matrix.pkg_prefix }}-pkgconf
            ${{ matrix.libopenmpt_pkg }}
            ${{ matrix.pkg_prefix }}-libogg
            ${{ matrix.pkg_prefix }}-libvorbis
            ${{ matrix.pkg_prefix }}-zlib
            ${{ matrix.pkg_prefix }}-mpg123
            ${{ matrix.go_pkg }}
            ${{ matrix.rust_pkg }}
            make
            curl
            ca-certificates
          path-type: inherit
      - name: Set version info
        run: |
          # Same reasoning as the unix job: prefer env vars over interpolation.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            sha=$(git rev-parse --short HEAD)
            echo "VERSION=dev-r${GITHUB_RUN_ID}-$sha" >> $GITHUB_ENV
          fi
      - name: Build binary
        run: |
          set -eux
          go version
          export GOARCH=${{ matrix.goarch }}
          export CC="${{ matrix.cc }}"
          export CXX="${{ matrix.cxx }}"
          export CGO_CFLAGS="$(pkg-config --cflags libopenmpt)"
          export CGO_LDFLAGS="$(pkg-config --libs libopenmpt)"
          make build
      - name: Collect DLLs
        run: |
          set -eux
          mkdir -p dist
          cp neoviolet.exe dist/
          cp apecli.exe dist/ 2>/dev/null || true
          cp neoviolet-gui.exe dist/ 2>/dev/null || true
          BIN_DIR="/${{ matrix.env_prefix }}/bin"
          SYSTEM_DLLS="^(KERNEL32|ntdll|USER32|GDI32|ADVAPI32|SHELL32|OLE32|MSVCRT|VCRUNTIME|api-ms-win|ucrtbase|WS2_32|IPHLPAPI|SETUPAPI|CRYPT32|bcrypt|PSAPI|WINMM|VERSION|combase|RPCRT4|SHLWAPI|oleaut32|IMM32|MSCTF|kernel\.appcore|windows\.storage)\.dll$"
          declare -A seen
          to_process=("neoviolet.exe" "neoviolet-gui.exe")
          while [ ${#to_process[@]} -gt 0 ]; do
            current="${to_process[0]}"
            to_process=("${to_process[@]:1}")
            deps=$(objdump -p "$current" | grep "DLL Name" | awk '{print $3}' \
              | sort -u)
            for dll in $deps; do
              if [[ "$dll" =~ $SYSTEM_DLLS ]] || [[ -v seen[$dll] ]]; then
                continue
              fi
              seen["$dll"]=1
              SRC="${BIN_DIR}/${dll}"
              if [ -f "$SRC" ]; then
                cp "$SRC" dist/
                to_process+=("$SRC")
              else
                echo "Skipping (not found in $BIN_DIR): $dll"
              fi
            done
          done
          ls -lh dist/
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neoviolet-windows-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
