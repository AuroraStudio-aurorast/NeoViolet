name: Build libopenmpt dependency

# Builds libopenmpt, the project's only external dependency, for every
# platform the project ships: macOS (universal), musl, and Windows. The
# version, the source URLs, the checksums and the per-platform floors come
# from deps/libopenmpt.lock, and each platform's recipe lives in
# deps/libopenmpt-build-<platform>.sh.
#
# Two jobs, not one five-entry matrix: a step's shell cannot be an
# expression, so the shell has to be a job-level default, and the Windows
# legs need the msys2 shell that carries the CLANG64/CLANGARM64 toolchain
# while the others need bash. Both jobs run the same steps, written once
# and shared below through YAML anchors.
#
# One workflow, not three: the platforms share the lock file and the smoke test,
# and a single run produces one consistent set of artifacts from one revision of
# them. The accepted cost is that a change under deps/ rebuilds every platform.
#
# Everything is built under $RUNNER_TEMP, so the checkout is only ever read, and
# publishing is off by default. Published artifacts go to a single pre-release
# tagged `deps`, not to a release per platform and version, so the Releases page
# keeps listing only the application's own versions. Every action is pinned to a
# commit SHA.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built libraries to their releases
        type: boolean
        default: false
  push:
    paths:
      - deps/**
      - .github/workflows/deps-libopenmpt.yml
  pull_request:
    paths:
      - deps/**
      - .github/workflows/deps-libopenmpt.yml

permissions:
  contents: read

jobs:
  # macOS and musl: POSIX hosts, bash.
  unix:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macOS universal
            platform: macos
            runner: macos-latest
            arch: arm64 x86_64
            artifact: libopenmpt-universal
          - target: musl x86_64
            platform: musl
            runner: ubuntu-latest
            arch: x86_64
            artifact: libopenmpt-musl-x86_64
          # The arm64 musl build runs natively on an arm64 runner, so the
          # container executes the library it just compiled.
          - target: musl arm64
            platform: musl
            runner: ubuntu-24.04-arm
            arch: arm64
            artifact: libopenmpt-musl-arm64
    defaults:
      run:
        shell: bash
    steps:
      - &checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Nothing here pushes with git; gh authenticates from GH_TOKEN.
          persist-credentials: false

      - &lock
        name: Read deps/libopenmpt.lock
        run: |
          set -euo pipefail
          # The character class needs digits: keys end in 256.
          grep -E '^[A-Z0-9_]+=' deps/libopenmpt.lock >> "$GITHUB_ENV"
          keys=$(sed -n 's/^\([A-Z0-9_]*\)=.*/\1/p' deps/libopenmpt.lock)
          for key in $keys; do
            if ! grep -qE "^$key=.+" deps/libopenmpt.lock; then
              echo "::error::$key is empty"
              exit 1
            fi
          done

      - &prepare
        name: Prepare the build directory
        run: |
          set -euo pipefail
          # runner.temp is a native Windows path on the Windows runners, while
          # the steps that follow run under the msys2 shell and need the POSIX
          # form. The platform scripts read the result as WORK.
          WORK_HOST="${{ runner.temp }}/libopenmpt-deps"
          case "$WORK_HOST" in
            *\\* | [A-Za-z]:*)
              if converted="$(cygpath -u "$WORK_HOST" 2>/dev/null)"; then
                WORK="$converted"
              else
                WORK="$WORK_HOST"
              fi
              ;;
            *) WORK="$WORK_HOST" ;;
          esac
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - &fetch
        name: Fetch and verify the sources
        run: sh deps/libopenmpt-fetch-sources.sh

      - &build
        name: Build, verify and package libopenmpt
        env:
          SMOKE_SRC: ${{ github.workspace }}/deps/libopenmpt-smoke.c
        run: |
          set -euo pipefail
          # Each platform script reads the arch under its own variable name.
          case "${{ matrix.platform }}" in
            macos)   export ARCHS="${{ matrix.arch }}" ;;
            musl)    export MUSL_ARCH="${{ matrix.arch }}" ;;
            windows) export WINDOWS_ARCH="${{ matrix.arch }}" ;;
          esac
          export VERSION="$LIBOPENMPT_VERSION"
          sh "deps/libopenmpt-build-${{ matrix.platform }}.sh"

      - &upload
        name: Upload the artifacts
        # actions/upload-artifact v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/libopenmpt-deps/out/*
          if-no-files-found: error

  # Windows: the same steps, under the msys2 shell. Both architectures run their
  # smoke test natively, so aarch64 is verified on real hardware.
  windows:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows x86_64
            platform: windows
            runner: windows-latest
            msystem: CLANG64
            pkg_prefix: mingw-w64-clang-x86_64
            arch: x86_64
            artifact: libopenmpt-windows-x86_64
          - target: Windows aarch64
            platform: windows
            runner: windows-11-arm
            msystem: CLANGARM64
            pkg_prefix: mingw-w64-clang-aarch64
            arch: aarch64
            artifact: libopenmpt-windows-aarch64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - *checkout

      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit
          # clang brings the binutils the recipe needs; the -binutils
          # packages are virtual and can fail non-interactively.
          install: >-
            ${{ matrix.pkg_prefix }}-clang
            make
            curl
            ca-certificates

      - *lock

      - *prepare

      - *fetch

      - *build

      - *upload

  # Off by default. All three platforms publish into ONE release, tagged `deps`
  # and marked pre-release: the Releases page is what users read as product
  # versions, so the dependency artifacts must not appear there as if they were
  # releases of their own. Versions are told apart by the asset names, which
  # carry the libopenmpt version, so the single release accumulates them all.
  # Creating it is a job of its own because the uploads below run in parallel
  # and cannot race to create it.
  release:
    name: Ensure the dependency release
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs:
      - unix
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Read deps/libopenmpt.lock
        run: grep -E '^[A-Z0-9_]+=' deps/libopenmpt.lock >> "$GITHUB_ENV"

      - name: Create it, unless it already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view deps >/dev/null 2>&1; then
            echo "The deps release exists; this run only adds assets to it."
            exit 0
          fi
          # The notes come from stdin so the text can stay readable here.
          gh release create deps \
            --prerelease \
            --title "Bundled dependencies (libopenmpt)" \
            --notes-file - <<NOTES
          Prebuilt libopenmpt, the run-time dependency of NeoViolet. This is
          not a product release: the application's own versions are the v*
          releases.

          Each asset is named after its libopenmpt version and platform, so
          this one release accumulates every version that has been built.

          - macOS: universal (arm64 + x86_64), minimum macOS ${MACOS_MIN}
          - musl: per architecture, built in alpine:${MUSL_BASELINE}
          - Windows: per architecture; install it as libopenmpt.dll next to the
            executable

          Every asset has a matching .sha256 file. The version and the platform
          floors come from deps/libopenmpt.lock in the repository.
          NOTES

  publish:
    name: Publish ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macOS
            artifacts: libopenmpt-universal
          - target: musl
            artifacts: 'libopenmpt-musl-*'
          - target: Windows
            artifacts: 'libopenmpt-windows-*'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Download this run's artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            -p "${{ matrix.artifacts }}" -D out

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Asset names carry the version, so a shared release cannot clash
          # across versions; --clobber covers rebuilding an existing one.
          gh release upload deps --clobber out/*/*
